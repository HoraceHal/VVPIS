name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      - name: Syntax and unit checks
        run: |
          bash -n install.sh
          python3 -m compileall -q vvpis tests
          python3 -m unittest discover -s tests -v
  fresh-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Full installer, HTTPS frontend and both protocols on disposable runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 tests/integration_install.py
